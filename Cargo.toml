[package]
name = "jamp"
version = "0.1.0"
edition = "2021"
description = "Just Another Music Player - a lightweight, skinnable music player with analog-media skins"
repository = "https://github.com/The1Azreen/Just-Another-Music-Player"

[[bin]]
name = "jamp"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "persistence", "wayland", "x11"] }
egui = "0.31"
rodio = { version = "0.20", default-features = false }
symphonia = { version = "0.5", features = ["all"] }
lofty = "0.22"
ureq = { version = "2.12", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Decoding in debug builds is painfully slow without this.
[profile.dev.package."*"]
opt-level = 2

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
